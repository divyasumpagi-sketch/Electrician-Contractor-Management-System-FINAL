<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxiLex | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="auth-container">
        <div class="card" id="login-card">
            <h2>AxiLex Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
                Don't have an account? <a href="#" id="show-register">Register here</a>
            </p>
        </div>

        <div class="card hidden" id="register-card">
            <h2>AxiLex Registration</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="reg-role">Role</label>
                    <select id="reg-role" class="form-control" required>
                        <option value="CLIENT">Client</option>
                        <option value="ELECTRICIAN">Electrician</option>
                    </select>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
                Already have an account? <a href="#" id="show-login">Login here</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // UI toggling
        const loginCard = document.getElementById('login-card');
        const registerCard = document.getElementById('register-card');
        document.getElementById('show-register').addEventListener('click', (e) => {
            e.preventDefault();
            loginCard.classList.add('hidden');
            registerCard.classList.remove('hidden');
        });
        document.getElementById('show-login').addEventListener('click', (e) => {
            e.preventDefault();
            registerCard.classList.add('hidden');
            loginCard.classList.remove('hidden');
        });

        // Form Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // For OAuth2 Form data
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail);
                
                localStorage.setItem('token', data.access_token);
                
                // Get User Profile to determine role
                const user = await apiCall('/users/me');
                localStorage.setItem('role', user.role);

                showToast('Login successful!');
                window.location.href = `${user.role.toLowerCase()}.html`;
                
            } catch (error) {
                showToast(error.message || 'Login failed', 'error');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            try {
                await apiCall('/register', 'POST', { name, email, password, role });
                showToast('Registration successful! Please login.');
                document.getElementById('show-login').click();
            } catch (error) {}
        });
    </script>
</body>
</html>
