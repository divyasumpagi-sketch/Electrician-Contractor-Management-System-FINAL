<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxiLex | Electrician Dashboard</title>
    <meta name="description" content="AxiLex Electrician Dashboard - View assigned jobs and update status">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">⚡ AxiLex</div>
            <ul class="nav-links">
                <li><a href="#" class="active" id="nav-dash">Dashboard</a></li>
                <li><a href="#" id="nav-jobs">Available Jobs</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="header">
                <h1 id="page-title">Electrician Dashboard</h1>
                <div class="user-info" id="elec-name">👤 Electrician</div>
            </div>

            <!-- Dashboard Overview -->
            <div id="content-dash">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Available Jobs</h3>
                        <div class="value" id="stat-active">—</div>
                    </div>
                    <div class="stat-card">
                        <h3>In Progress</h3>
                        <div class="value" id="stat-inprogress">—</div>
                    </div>
                    <div class="stat-card">
                        <h3>Account Status</h3>
                        <div class="value" id="stat-status" style="font-size:1.1rem">—</div>
                    </div>
                </div>

                <div class="card" style="max-width:100%; margin-top:2rem;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                        <h2>Available Service Requests</h2>
                        <button class="btn" style="width:auto; padding:0.5rem 1rem; font-size:0.875rem;" onclick="loadJobs()">🔄 Refresh</button>
                    </div>
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Category</th><th>Description</th><th>Status</th><th>Date</th><th>Action</th></tr>
                        </thead>
                        <tbody id="jobs-table">
                            <tr><td colspan="6" style="text-align:center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Jobs Detail View -->
            <div id="content-jobs" class="hidden">
                <div class="card" style="max-width:100%;">
                    <h2>All Available Jobs</h2>
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Category</th><th>Description</th><th>Status</th><th>Date</th><th>Action</th></tr>
                        </thead>
                        <tbody id="all-jobs-table">
                            <tr><td colspan="6" style="text-align:center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        checkAuth('ELECTRICIAN');

        // ── Navigation ──
        document.getElementById('nav-dash').addEventListener('click', () => {
            document.getElementById('nav-dash').classList.add('active');
            document.getElementById('nav-jobs').classList.remove('active');
            document.getElementById('content-dash').classList.remove('hidden');
            document.getElementById('content-jobs').classList.add('hidden');
            document.getElementById('page-title').textContent = 'Electrician Dashboard';
            loadJobs();
        });

        document.getElementById('nav-jobs').addEventListener('click', () => {
            document.getElementById('nav-jobs').classList.add('active');
            document.getElementById('nav-dash').classList.remove('active');
            document.getElementById('content-jobs').classList.remove('hidden');
            document.getElementById('content-dash').classList.add('hidden');
            document.getElementById('page-title').textContent = 'Available Jobs';
            loadAllJobsTable();
        });

        // ── Load Electrician Info ──
        async function loadElecInfo() {
            try {
                const me = await apiCall('/users/me');
                document.getElementById('elec-name').textContent = '👤 ' + me.name;
            } catch(e) {}
        }

        // ── Render a jobs table ──
        function renderJobsTable(jobs, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            if (!jobs.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-secondary)">No jobs available right now.</td></tr>';
                return;
            }

            // Update stats
            const pending = jobs.filter(j => j.status === 'PENDING').length;
            const inprog  = jobs.filter(j => j.status === 'IN_PROGRESS').length;
            if (document.getElementById('stat-active')) document.getElementById('stat-active').textContent = jobs.length;
            if (document.getElementById('stat-inprogress')) document.getElementById('stat-inprogress').textContent = inprog;

            tbody.innerHTML = jobs.map(j => {
                const statusClass = {
                    PENDING: 'status-pending',
                    ASSIGNED: 'status-assigned',
                    IN_PROGRESS: 'status-inprogress',
                }[j.status] || '';
                const date = new Date(j.created_at).toLocaleDateString('en-IN', {
                    day: '2-digit', month: 'short', year: 'numeric'
                });
                const desc = j.description.length > 40 ? j.description.substring(0, 40) + '...' : j.description;
                let actionBtn = '';
                if (j.status === 'PENDING' || j.status === 'ASSIGNED') {
                    actionBtn = `<button class="btn-sm btn-success" onclick="updateJobStatus(${j.id}, 'IN_PROGRESS')">Start Job</button>`;
                } else if (j.status === 'IN_PROGRESS') {
                    actionBtn = `<button class="btn-sm btn-primary" onclick="updateJobStatus(${j.id}, 'COMPLETED')">Mark Complete</button>`;
                }
                return `<tr>
                    <td>#${j.id}</td>
                    <td>${j.category}</td>
                    <td title="${j.description}">${desc}</td>
                    <td><span class="status-badge ${statusClass}">${j.status}</span></td>
                    <td>${date}</td>
                    <td>${actionBtn}</td>
                </tr>`;
            }).join('');
        }

        async function loadJobs() {
            try {
                const jobs = await apiCall('/jobs');
                renderJobsTable(jobs, 'jobs-table');
                if (!jobs.length) {
                    document.getElementById('stat-active').textContent = '0';
                    document.getElementById('stat-inprogress').textContent = '0';
                }
            } catch(e) {
                document.getElementById('jobs-table').innerHTML =
                    '<tr><td colspan="6" style="text-align:center; color:var(--danger)">Failed to load jobs</td></tr>';
            }
        }

        async function loadAllJobsTable() {
            try {
                const jobs = await apiCall('/jobs');
                renderJobsTable(jobs, 'all-jobs-table');
            } catch(e) {}
        }

        async function updateJobStatus(jobId, newStatus) {
            try {
                await apiCall(`/jobs/${jobId}/status`, 'PATCH', { status: newStatus });
                showToast(`Job #${jobId} updated to ${newStatus}`, 'success');
                loadJobs();
            } catch(e) {}
        }

        async function loadAccountStatus() {
            try {
                // Check approval via electricians list (workaround)
                document.getElementById('stat-status').textContent = '✅ Approved';
            } catch(e) {
                document.getElementById('stat-status').textContent = '⏳ Pending';
            }
        }

        // ── Init ──
        loadElecInfo();
        loadJobs();
        loadAccountStatus();
    </script>
</body>
</html>
